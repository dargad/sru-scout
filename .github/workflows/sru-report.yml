name: Daily SRU report

on:
  schedule:
    - cron: "15 8 * * *"
      timezone: "Europe/Warsaw"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Install sru-lint
        run: sudo snap install --edge sru-lint

      - name: Review the SRU board
        env:
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          SRU_SCOUT_LLM_URL: ${{ vars.SRU_SCOUT_LLM_URL }}
          SRU_SCOUT_LLM_MODEL: ${{ vars.SRU_SCOUT_LLM_MODEL }}
          SRU_SCOUT_LLM_API_KEY: ${{ secrets.SRU_SCOUT_LLM_API_KEY }}
        run: |
          mkdir -p site
          # adds --llm only when the LLM repository variables are set
          uv run sru-scout review --html site/index.html ${SRU_SCOUT_LLM_MODEL:+--llm}

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: report
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
