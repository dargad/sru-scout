[project]
name = "sru-scout"
version = "0.1.0"
description = "Agent that triages Ubuntu SRU Jira cards against Launchpad bugs, patches and merge proposals"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "rich>=13.7",
    "jinja2>=3.1",
]

[project.scripts]
sru-scout = "sru_scout.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sru_scout"]

[tool.pytest.ini_options]
testpaths = ["tests"]
